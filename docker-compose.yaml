services:
  postgres:
    image: postgres:16-alpine
    container_name: eByte_Software_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --lc-collate=C --lc-ctype=C"
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app_network
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: eByte_Software_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
      SCRIPT_NAME: /pgadmin
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - app_network
  minio:
    image: minio/minio:latest
    container_name: eByte_Software_minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BROWSER_REDIRECT_URL: http://${BASE_DOMAIN}/minio/
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web console
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app_network
  seq:
    image: datalust/seq:latest
    container_name: eByte_Software_seq
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      SEQ_FIRSTRUN_NOAUTHENTICATION: "true"
      SEQ_API_LISTENURIS: http://0.0.0.0:80,http://0.0.0.0:5341
      SEQ_API_CANONICALURI: http://${BASE_DOMAIN}/seq/
    ports:
      - "8081:80"
      - "5341:5341"
    volumes:
      - seq_data:/data
    networks:
      - app_network
  redis:
    image: redis:7-alpine
    container_name: eByte_Software_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - app_network
  libretranslate:
    image: libretranslate/libretranslate:latest
    container_name: libretranslate
    restart: unless-stopped
    command: ["--load-only", "en,fr,ar,es,it,ja,zh,ko,de"]
    environment:
      LT_DISABLE_WEB_UI: "true"
    volumes:
      - libretranslate_models:/home/libretranslate/.local
    networks:
      - app_network
  backend:
    build:
      context: ./backend/NFC_Backend
      dockerfile: NFC_Backend/Dockerfile
    container_name: nfc_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      seq:
        condition: service_started
      redis:
        condition: service_healthy
      libretranslate:
        condition: service_started
      # migrator:
      #   condition: service_completed_successfully
    ports:
      - "7194:8080"
    networks:
      - app_network
    environment:
      ASPNETCORE__ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ASPNETCORE__URLS: http://+:8080
      Serilog__WriteTo__1__Args__serverUrl: ${SEQ_SERVER_URL:-http://seq:5341}

      ConnectionStrings__SmartMenuDb: Host=postgres;Port=${DB_PORT};Database=${DB_NAME};Username=${DB_USER};Password=${DB_PASSWORD}
      ConnectionStrings__Redis: ${REDIS_CONNECTION_STRING:-redis:6379,abortConnect=false}

      Jwt__Secret: ${JWT_SECRET}
      Jwt__Issuer: ${JWT_ISSUER}
      Jwt__Audience: ${JWT_AUDIENCE}
      Jwt__AccessTokenExpiryMinutes : ${JWT_ACCESS_TOKEN_EXPIRY_MINUTES}
      Jwt__RefreshTokenExpiryDays : ${JWT_REFRESH_TOKEN_EXPIRY_DAYS}
      Minio__Endpoint: minio:9000
      Minio__FileAPI : ${BASE_DOMAIN}/minio-api
      Minio__AccessKey: ${MINIO_ACCESS_KEY}
      Minio__SecretKey: ${MINIO_SECRET_KEY}
      Minio__BucketName: ${MINIO_BUCKET_NAME}
      Minio__UseSsl: ${MINIO_USE_SSL}

      AppSettings__BaseDomain: ${BASE_DOMAIN}
      AppSettings__UseHttps: ${MINIO_USE_SSL}
      AppSettings__DefaultPort : ${DEFAULT_PORT}
      AppSettings__UseRedis: ${USE_REDIS:-true}

      ExchangeRateApi__ApiKey: ${EXCHANGE_RATE_API_KEY}
      GmailSettings__AppPassword: ${GMAIL_APP_PASSWORD}
      GmailSettings__SenderEmail : ${GMAIL_SENDER_EMAIL}
      GmailSettings__SenderName : ${GMAIL_SENDERNAME}
      GmailSettings__Host : ${GMAIL_HOST}
      GmailSettings__Port : ${GMAIL_PORT}
      AzureTranslator__ApiKey: ${AZURE_TRANSLATOR_API_KEY}
      AzureTranslator__Region : ${AZURE_TRANSLATOR_REGION}
      AzureTranslator__Endpoint : ${AZURE_TRANSLATOR_ENDPOINT}
      LibreTranslate__Endpoint: http://libretranslate:5000
      LibreTranslate__ApiKey: ${LIBRETRANSLATE_API_KEY:-}
      Gemini__ApiKey: ${GEMINI_API_KEY}
      Gemini__Model : ${GEMINI_MODEL}
      Variable__FreeTrialDays: ${FREE_TRIAL_DAYS}
      Variable__SessionExpirationHours : ${SESSION_EXPIRATION_HOURS}

      profiles__http__applicationUrl : ${BACKEND_URL}

