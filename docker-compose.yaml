services:
  postgres:
    image: postgres:16-alpine
    container_name: eByte_Software_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --lc-collate=C --lc-ctype=C"
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app_network
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: eByte_Software_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
      SCRIPT_NAME: /pgadmin
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - app_network
  minio:
    image: minio/minio:latest
    container_name: eByte_Software_minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BROWSER_REDIRECT_URL: http://${BASE_DOMAIN}/minio/
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web console
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app_network
  backend:
    build:
      context: ./backend/NFC_Backend
      dockerfile: NFC_Backend/Dockerfile
    container_name: nfc_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    ports:
      - "7194:8080"
    networks:
      - app_network
    environment:
      ASPNETCORE__ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ASPNETCORE__URLS: http://+:8080

      ConnectionStrings__SmartMenuDb: Host=postgres;Port=${DB_PORT};Database=${DB_NAME};Username=${DB_USER};Password=${DB_PASSWORD}

      Jwt__Secret: ${JWT_SECRET}
      Jwt__Issuer: ${JWT_ISSUER}
      Jwt__Audience: ${JWT_AUDIENCE}
      Jwt__AccessTokenExpiryMinutes : ${JWT_ACCESS_TOKEN_EXPIRY_MINUTES}
      Jwt__RefreshTokenExpiryDays : ${JWT_REFRESH_TOKEN_EXPIRY_DAYS}
      Minio__Endpoint: minio:9001
      Minio__FileAPI : ${BASE_DOMAIN}/minio-api
      Minio__AccessKey: ${MINIO_ACCESS_KEY}
      Minio__SecretKey: ${MINIO_SECRET_KEY}
      Minio__BucketName: smart-menu-nfc
      Minio__UseSsl: "false"

      AppSettings__BaseDomain: ${BASE_DOMAIN}
      AppSettings__UseHttps: "false"
      AppSettings__DefaultPort : ${DEFAULT_PORT}

      ExchangeRateApi__ApiKey: ${EXCHANGE_RATE_API_KEY}
      GmailSettings__AppPassword: ${GMAIL_APP_PASSWORD}
      GmailSettings__SenderEmail : ${GMAIL_SENDER_EMAIL}
      GmailSettings__SenderName : ${GMAIL_SENDERNAME}
      GmailSettings__Host : ${GMAIL_HOST}
      GmailSettings__Port : ${GMAIL_PORT}
      AzureTranslator__ApiKey: ${AZURE_TRANSLATOR_API_KEY}
      AzureTranslator__Region : ${AZURE_TRANSLATOR_REGION}
      AzureTranslator__Endpoint : ${AZURE_TRANSLATOR_ENDPOINT}
      Gemini__ApiKey: ${GEMINI_API_KEY}
      Gemini__Model : ${GEMINI_MODEL}
      Variable__FreeTrialDays: ${FREE_TRIAL_DAYS}
      Variable__SessionExpirationHours : ${SESSION_EXPIRATION_HOURS}

      profiles__http__applicationUrl : ${BACKEND_URL}

  # migrator:
  #   build:
  #     context: ./backend/NFC_Backend
  #     dockerfile: NFC_Backend/Dockerfile
  #   container_name: nfc_ef_migrator
  #   command: ["dotnet", "NFC_Backend.dll", "--migrate-only"]
  #   restart: "no"
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #   environment:
  #     ConnectionStrings__SmartMenuDb: Host=postgres;Port=${DB_PORT};Database=${DB_NAME};Username=${DB_USER};Password=${DB_PASSWORD}
  #   networks:
  #     - app_network

  menu:
    build:
      context: ./Admin FrontEnd/Menu
      args:
        VITE_API_URL: ${VITE_API_URL}
        VITE_BASE_DOMAIN: ${VITE_BASE_DOMAIN}
        VITE_DEV_TENANT: ${VITE_DEV_TENANT}
        VITE_USE_MOCK: ${VITE_USE_MOCK}
        VITE_MOCK_ORDER_LINE: ${VITE_MOCK_ORDER_LINE}
    container_name: menu_client
    restart: unless-stopped
    networks:
      - app_network

  snack-x-menu-admin:
    build:
      context: ./Admin FrontEnd/Snack-X-Menu-Admin
      args:
        VITE_API_URL: ${VITE_API_URL}
    container_name: snack_x_menu_admin
    restart: unless-stopped
    networks:
      - app_network

  gateway:
    image: nginx:alpine
    container_name: app_gateway
    restart: unless-stopped
    depends_on:
      - backend
      - menu
      - snack-x-menu-admin
    ports:
      - "80:80"
    volumes:
      - ./nginx/conf.d/app.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - app_network

volumes:
  pg_data:
  pgadmin_data:
  minio_data: 

networks:
  app_network:
    driver: bridge
