  #       condition: service_healthy
  #   environment:
  #     ConnectionStrings__SmartMenuDb: Host=postgres;Port=${DB_PORT};Database=${DB_NAME};Username=${DB_USER};Password=${DB_PASSWORD}
  #   networks:
  #     - app_network

  menu:
    build:
      context: ./Admin FrontEnd/Menu
      args:
        VITE_API_URL: ${VITE_API_URL}
        VITE_BASE_DOMAIN: ${VITE_BASE_DOMAIN}
        VITE_DEV_TENANT: ${VITE_DEV_TENANT}
        VITE_USE_MOCK: ${VITE_USE_MOCK}
        VITE_MOCK_ORDER_LINE: ${VITE_MOCK_ORDER_LINE}
    container_name: menu_client
    restart: unless-stopped
    networks:
      - app_network

  snack-x-menu-admin:
    build:
      context: ./Admin FrontEnd/Snack-X-Menu-Admin
      args:
        VITE_API_URL: ${VITE_API_URL}
    container_name: snack_x_menu_admin
    restart: unless-stopped
    networks:
      - app_network

  gateway:
    image: nginx:alpine
    container_name: app_gateway
    restart: unless-stopped
    depends_on:
      - backend
      - menu
      - snack-x-menu-admin
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d/app.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/ssl/cloudflare/origin.pem:/etc/ssl/cloudflare/origin.pem:ro
      - /etc/ssl/cloudflare/origin.key:/etc/ssl/cloudflare/origin.key:ro
    networks:
      - app_network

volumes:
  pg_data:
  pgadmin_data:
  minio_data: 
  seq_data:
  redis_data:
  libretranslate_models:

networks:
  app_network:
    driver: bridge
